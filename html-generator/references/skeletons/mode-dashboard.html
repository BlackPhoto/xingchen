<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{文档标题}</title>
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { min-height: 100%; }
body {
  position: relative;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", "Noto Sans SC", sans-serif;
  color: {text};
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  max-width: 860px;
  margin: 0 auto;
  padding: 40px 24px;
  background: linear-gradient(160deg, {bg_gradient_a} 0%, {card} 45%, {bg_gradient_b} 100%);
  min-height: 100vh;
}
/* 全局光斑 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 45% 35% at 18% 8%, rgba(255,255,255,0.55) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 88% 90%, rgba(255,255,255,0.45) 0%, transparent 55%);
}
body > * { position: relative; z-index: 1; }

/* ========== 封面 Hero（深色渐变 + 白字大数字） ========== */
.title {
  position: relative;
  overflow: hidden;
  padding: 52px 40px;
  text-align: center;
  background: linear-gradient(135deg, {gradient_start} 0%, {gradient_mid} 50%, {gradient_end} 100%);
  color: #ffffff;
  border-radius: 16px;
  margin-bottom: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}
.title::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 55% at 18% 82%, rgba(255,255,255,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 55% 40% at 82% 18%, rgba(255,255,255,0.08) 0%, transparent 55%);
  pointer-events: none;
}
.title > * { position: relative; z-index: 1; }
.title h1 { font-size: 28px; font-weight: 800; margin: 0 0 14px 0; letter-spacing: 1px; color: #ffffff; }
.title .accent-line {
  width: 48px; height: 3px; background: rgba(255,255,255,0.85);
  margin: 0 auto 18px; border-radius: 2px;
}
.title p { font-size: 15px; color: rgba(255,255,255,0.85); margin: 0; line-height: 1.7; }

/* ========== 章节标题 ========== */
h1.heading {
  font-size: 28px;
  color: {primary};
  margin: 36px 0 16px 0;
  font-weight: 700;
  border-left: 4px solid {accent};
  padding-left: 16px;
}
h2.heading {
  font-size: 22px;
  color: {primary};
  margin: 28px 0 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid {primary_light};
  font-weight: 600;
}

/* ========== 核心指标区（stat 大数字） ========== */
.stat-grid { display: flex; gap: 16px; margin: 0 0 16px 0; }
.stat {
  flex: 1;
  text-align: center;
  padding: 24px;
  background: {card};
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  border-top: 3px solid {accent};
}
.stat .num { font-size: 28px; color: {accent}; font-weight: 800; line-height: 1.1; }
.stat .label { font-size: 12px; color: {text_secondary}; margin-top: 6px; }

/* ========== 趋势卡（迷你图） ========== */
.trend-card {
  background: {card};
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  margin: 0 0 16px 0;
}
.trend-card h3 { font-size: 18px; color: {primary}; margin: 0 0 8px 0; font-weight: 700; }
.mini-chart { display: flex; align-items: flex-end; gap: 6px; height: 60px; margin: 8px 0 0 0; }
.mini-chart .bar {
  flex: 1;
  border-radius: 3px 3px 0 0;
  background: linear-gradient(180deg, {accent}, {accent_light});
  min-height: 4px;
}
.trend-card .note { font-size: 12px; color: {text_secondary}; margin: 8px 0 0 0; }

/* ========== 表格（卡片化 + 渐变表头） ========== */
.table-wrap {
  background: {card};
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  overflow: hidden;
  margin: 0 0 16px 0;
}
.table-caption {
  padding: 14px 16px;
  background: linear-gradient(135deg, {primary_light}, {accent_light});
  color: {primary};
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  border-bottom: 1px solid {border};
}
table.table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; }
table.table thead th {
  padding: 12px 16px;
  text-align: left;
  background: {primary_light};
  color: {primary};
  font-weight: 700;
  border-bottom: 2px solid {border};
  word-break: break-word;
}
table.table tbody td { padding: 12px 16px; border-bottom: 1px solid {border}; color: {text}; word-break: break-word; }
table.table tbody tr:last-child td { border-bottom: none; }

/* ========== 数据来源引用标记 ========== */
.cite {
  font-size: 11px;
  color: {accent};
  font-weight: 600;
  vertical-align: super;
  margin-left: 2px;
  text-decoration: none;
  cursor: pointer;
}
.cite:hover {
  color: {primary};
  text-decoration: underline;
}

/* ========== 来源列表 ========== */
.source-list { margin: 0 0 16px 0; }
.source-list ol {
  padding-left: 20px;
  font-size: 13px;
  color: {text_secondary};
  line-height: 2.0;
}
.source-list ol li { margin-bottom: 6px; }
.source-list ol li strong { color: {primary}; }
.source-list .src-id {
  display: inline-block;
  width: 24px;
  font-weight: 700;
  color: {accent};
}
.source-list .source-link {
  color: {accent_dark};
  text-decoration: none;
  border-bottom: 1px solid rgba(59, 130, 246, 0.35);
  transition: color 0.15s ease, border-color 0.15s ease;
}
.source-list .source-link:hover {
  color: {primary_dark};
  border-bottom-color: {primary_dark};
}

/* ========== callout ========== */
.callout {
  margin: 0 0 16px 0;
  padding: 16px 24px;
  background: {accent_light};
  border-left: 4px solid {accent};
  border-radius: 8px;
}
.callout p { font-size: 15px; color: {text}; margin: 0; line-height: 1.8; }

/* ========== 响应式 ========== */
@media screen and (max-width: 600px) {
  body { padding: 16px !important; }
  h1 { font-size: 22px !important; }
  h2 { font-size: 18px !important; }
  h3 { font-size: 16px !important; }
  .stat-grid { flex-direction: column; }
}

/* ========== 打印优化 ========== */
@media print {
  body {
    padding: 0 !important;
    margin: 0 !important;
    background: {bg};
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  body::before { display: none; }
  .title { border-radius: 0; box-shadow: none; }
  .stat, .trend-card, .table-wrap { box-shadow: none; border: 1px solid {border}; }
  section { break-inside: auto !important; }
}
</style>
</head>
<body class="mode-dashboard" data-palette="{调色板ID}">

  <!-- ===== title: 封面 ===== -->
  <section class="title">
    <h1>{数据简报标题}</h1>
    <div class="accent-line"></div>
    <p>{数据周期/口径说明}</p>
  </section>

  <!-- ===== 核心指标区（stat 大数字） ===== -->
  <div class="stat-grid" data-cols="4">
    <div class="stat">
      <div class="num">{数值}</div>
      <div class="label">{指标名}</div>
    </div>
    <div class="stat">
      <div class="num">{数值}</div>
      <div class="label">{指标名}</div>
    </div>
    <div class="stat">
      <div class="num">{数值}</div>
      <div class="label">{指标名}</div>
    </div>
    <div class="stat">
      <div class="num">{数值}</div>
      <div class="label">{指标名}</div>
    </div>
  </div>

  <!-- ===== 趋势分析（迷你图 card） ===== -->
  <h1 class="heading">{趋势分析}</h1>
  <div class="trend-card">
    <h3>{指标名称 近N期趋势}</h3>
    <div class="mini-chart">
      <div class="bar" style="height:30%;"></div>
      <div class="bar" style="height:45%;"></div>
      <div class="bar" style="height:38%;"></div>
      <div class="bar" style="height:60%;"></div>
      <div class="bar" style="height:52%;"></div>
      <div class="bar" style="height:75%;"></div>
      <div class="bar" style="height:88%;"></div>
    </div>
    <p class="note">{图表说明}</p>
  </div>

  <!-- ===== 明细表格 ===== -->
  <h2 class="heading">{明细数据}</h2>
  <div class="table-wrap">
    <div class="table-caption">{表格标题}</div>
    <table class="table" data-caption="{表格标题}">
      <!-- 各列内容长度差异大时，可加 <colgroup> 指定列宽比例，不写则均分 -->
      <thead>
        <tr>
          <th>{列1}</th>
          <th>{列2}</th>
          <th>{列3}</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>{维度1}</td>
          <td>{数值}</td>
          <td>{数值}</td>
        </tr>
        <tr>
          <td>{维度2}</td>
          <td>{数值}</td>
          <td>{数值}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ===== 结论（callout） ===== -->
  <aside class="callout" data-variant="tip">
    <p>{数据结论/经营洞察}</p>
  </aside>

</body>
</html>
