<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{文档标题}</title>
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { min-height: 100%; }
body {
  position: relative;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", "Noto Sans SC", sans-serif;
  color: {text};
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 24px;
  background: linear-gradient(160deg, {bg_gradient_a} 0%, {card} 45%, {bg_gradient_b} 100%);
  min-height: 100vh;
}
/* 全局光斑：两个白色 radial 光晕，营造页面呼吸感（纯装饰，转换时忽略） */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 45% 35% at 12% 8%, rgba(255,255,255,0.55) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 88% 90%, rgba(255,255,255,0.45) 0%, transparent 55%);
}
body > * { position: relative; z-index: 1; }

/* ========== 封面 Hero（深色渐变 + 光斑 + 白字） ========== */
.title {
  position: relative;
  overflow: hidden;
  padding: 56px 40px;
  text-align: center;
  background: linear-gradient(135deg, {gradient_start} 0%, {gradient_mid} 50%, {gradient_end} 100%);
  color: #ffffff;
  border-radius: 16px;
  margin-bottom: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}
.title::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 55% at 18% 82%, rgba(255,255,255,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 55% 40% at 82% 18%, rgba(255,255,255,0.08) 0%, transparent 55%);
  pointer-events: none;
}
.title > * { position: relative; z-index: 1; }
.title h1 { font-size: 28px; font-weight: 800; margin: 0 0 14px 0; letter-spacing: 1px; color: #ffffff; }
.title .accent-line {
  width: 48px; height: 3px; background: rgba(255,255,255,0.85);
  margin: 0 auto 18px; border-radius: 2px;
}
.title p { font-size: 15px; color: rgba(255,255,255,0.85); margin: 0; line-height: 1.7; }

/* ========== 章节标题 ========== */
h1.heading {
  font-size: 28px;
  color: {primary};
  margin: 36px 0 16px 0;
  font-weight: 700;
  border-left: 4px solid {accent};
  padding-left: 16px;
}
h2.heading {
  font-size: 22px;
  color: {primary};
  margin: 28px 0 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid {primary_light};
  font-weight: 600;
}

/* ========== 正文 / 列表 ========== */
.paragraph { font-size: 15px; color: {text}; line-height: 1.8; margin: 0 0 16px 0; text-indent: 2em; }
.list { margin: 0 0 16px 0; padding-left: 24px; font-size: 15px; color: {text}; line-height: 1.8; }
.list li { margin-bottom: 8px; }
.list li::marker { color: {accent}; }

/* ========== 正文区卡片化容器 ========== */
.doc-section {
  background: {card};
  border-radius: 14px;
  padding: 24px 28px;
  margin: 0 0 16px 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
.doc-section.alt { background: {bg_deep}; box-shadow: none; }

/* ========== callout ========== */
.callout {
  margin: 0 0 16px 0;
  padding: 16px 24px;
  background: {accent_light};
  border-left: 4px solid {accent};
  border-radius: 8px;
}
.callout[data-variant="warning"] { background: #FFF3E0; border-left-color: {warning}; }
.callout[data-variant="quote"]   { background: #f0fdfa; border-left-color: #14b8a6; }
.callout p { font-size: 15px; color: {text}; margin: 0; line-height: 1.8; }

/* ========== 表格 ========== */
.table-wrap {
  background: {card};
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  overflow: hidden;
  margin: 0 0 16px 0;
}
.table-caption {
  padding: 12px 16px;
  background: linear-gradient(135deg, {primary_light}, {accent_light});
  color: {primary};
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  border-bottom: 1px solid {border};
}
table.table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; }
table.table thead th {
  padding: 12px 16px;
  text-align: left;
  background: {primary_light};
  color: {primary};
  font-weight: 700;
  border-bottom: 2px solid {border};
  word-break: break-word;
}
table.table tbody td { padding: 12px 16px; border-bottom: 1px solid {border}; color: {text}; word-break: break-word; }
table.table tbody tr:last-child td { border-bottom: none; }
table.table tbody tr:hover { background: {accent_light}; }

/* ========== 数据来源引用标记 ========== */
.cite {
  font-size: 11px;
  color: {accent};
  font-weight: 600;
  vertical-align: super;
  margin-left: 2px;
  text-decoration: none;
  cursor: pointer;
}
.cite:hover {
  color: {primary};
  text-decoration: underline;
}

/* ========== 来源列表 ========== */
.source-list { margin: 0 0 16px 0; }
.source-list ol {
  padding-left: 20px;
  font-size: 13px;
  color: {text_secondary};
  line-height: 2.0;
}
.source-list ol li { margin-bottom: 6px; }
.source-list ol li strong { color: {primary}; }
.source-list .src-id {
  display: inline-block;
  width: 24px;
  font-weight: 700;
  color: {accent};
}
.source-list .source-link {
  color: {accent_dark};
  text-decoration: none;
  border-bottom: 1px solid rgba(59, 130, 246, 0.35);
  transition: color 0.15s ease, border-color 0.15s ease;
}
.source-list .source-link:hover {
  color: {primary_dark};
  border-bottom-color: {primary_dark};
}

/* ========== stat ========== */
.stat-grid { display: flex; gap: 16px; margin: 0 0 16px 0; }
.stat {
  flex: 1;
  text-align: center;
  padding: 24px;
  background: {card};
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  border-top: 3px solid {accent};
}
.stat .num { font-size: 28px; color: {accent}; font-weight: 800; line-height: 1.1; }
.stat .label { font-size: 12px; color: {text_secondary}; margin-top: 6px; }

/* ========== timeline ========== */
.timeline { list-style: none; padding: 0; margin: 0 0 16px 0; }
.timeline li {
  position: relative;
  padding-left: 28px;
  padding-bottom: 18px;
  border-left: 2px solid {accent_light};
  margin-left: 6px;
}
.timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline li::before {
  content: '';
  position: absolute;
  left: -7px; top: 5px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: {accent};
  border: 2px solid {bg};
  box-shadow: 0 0 0 2px {accent_light};
}
.timeline strong { font-size: 14px; color: {accent}; }
.timeline p { font-size: 15px; color: {text}; margin: 4px 0 0 0; line-height: 1.8; }

/* ========== code ========== */
.code {
  background: #1e293b;
  color: #e2e8f0;
  padding: 16px 24px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.6;
  overflow-x: auto;
  margin: 0 0 16px 0;
  font-family: 'Cascadia Code', 'Fira Code', 'SF Mono', 'Source Code Pro', Consolas, monospace;
}

/* ========== card ========== */
.card-grid { display: flex; gap: 16px; margin: 0 0 16px 0; }
.card {
  flex: 1;
  background: {card};
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  border-top: 3px solid {accent};
}
.card h3 { font-size: 18px; color: {primary}; margin: 0 0 8px 0; font-weight: 700; }
.card p  { font-size: 14px; color: {text_secondary}; margin: 0; line-height: 1.7; }

/* ========== divider: 章节饰线（居中饰点分隔线） ========== */
.divider { margin: 32px 0; text-align: center; user-select: none; }
.divider .line {
  display: inline-block;
  width: 36px;
  height: 1px;
  vertical-align: middle;
  background: linear-gradient(to right, transparent, {accent_light});
}
.divider .line:last-child { background: linear-gradient(to left, transparent, {accent_light}); }
.divider .diamond {
  display: inline-block;
  width: 8px; height: 8px;
  margin: 0 12px;
  vertical-align: middle;
  transform: rotate(45deg);
  background: {accent};
  border-radius: 1px;
  box-shadow: 0 0 0 2px {bg};
}

/* ========== 尾页 ========== */
.end_page {
  margin-top: 24px;
  padding: 56px 24px;
  text-align: center;
  background: linear-gradient(135deg, {primary_light} 0%, {accent_light} 100%);
  border-radius: 16px;
}
.end_page h1 { font-size: 28px; color: {primary}; margin: 0 0 16px 0; font-weight: 800; }
.end_page p  { font-size: 15px; color: {text_secondary}; margin: 0; line-height: 1.8; }

/* ========== 响应式 ========== */
@media screen and (max-width: 600px) {
  body { padding: 16px !important; }
  h1 { font-size: 22px !important; }
  h2 { font-size: 18px !important; }
  h3 { font-size: 16px !important; }
  .stat-grid, .card-grid { flex-direction: column; }
}

/* ========== 打印优化 ========== */
@media print {
  body {
    padding: 0 !important;
    margin: 0 !important;
    background: {bg};
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  body::before { display: none; }
  .title, .end_page { border-radius: 0; box-shadow: none; }
  .doc-section, .card, .stat, .table-wrap { box-shadow: none; border: 1px solid {border}; }
  section { break-inside: auto !important; }
}
</style>
</head>
<body class="mode-doc" data-palette="{调色板ID}">

  <!-- ===== title: 封面（深色渐变 + 光斑 + 白字） ===== -->
  <section class="title">
    <h1>{文档标题}</h1>
    <div class="accent-line"></div>
    <p>{副标题/一句话描述}</p>
  </section>

  <!-- ===== heading: 第一章（data-level=1 转换时新起一页） ===== -->
  <h1 class="heading">{章节标题}</h1>

  <!-- ===== 正文区：白底卡片容器 ===== -->
  <div class="doc-section">
    <p class="paragraph">{正文内容}</p>
    <ul class="list">
      <li>{条目1}</li>
      <li>{条目2}</li>
    </ul>
  </div>

  <!-- ===== callout: 提示框 ===== -->
  <aside class="callout" data-variant="tip">
    <p>{提示内容}</p>
  </aside>

  <!-- ===== heading: 子章节（data-level=2） ===== -->
  <h2 class="heading">{子标题}</h2>

  <!-- ===== table: 数据表格 ===== -->
  <div class="table-wrap">
    <div class="table-caption">{表格标题}</div>
    <table class="table" data-caption="{表格标题}">
      <!-- 各列内容长度差异大时，可加 <colgroup> 指定列宽比例，不写则均分 -->
      <thead>
        <tr>
          <th>{列1}</th>
          <th>{列2}</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>{数据}</td>
          <td>{数据}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ===== stat: 数字指标 ===== -->
  <div class="stat-grid">
    <div class="stat">
      <div class="num">{数值}</div>
      <div class="label">{标签}</div>
    </div>
    <div class="stat">
      <div class="num">{数值}</div>
      <div class="label">{标签}</div>
    </div>
  </div>

  <!-- ===== timeline: 时间线 ===== -->
  <ol class="timeline">
    <li>
      <strong>{时间/阶段}</strong>
      <p>{事件描述}</p>
    </li>
    <li>
      <strong>{时间/阶段}</strong>
      <p>{事件描述}</p>
    </li>
  </ol>

  <!-- ===== code: 代码块 ===== -->
  <pre class="code" data-lang="python"><code>{代码内容}</code></pre>

  <!-- ===== card: 卡片 ===== -->
  <div class="card-grid" data-cols="3">
    <div class="card">
      <h3>{卡片标题}</h3>
      <p>{卡片内容}</p>
    </div>
    <div class="card">
      <h3>{卡片标题}</h3>
      <p>{卡片内容}</p>
    </div>
    <div class="card">
      <h3>{卡片标题}</h3>
      <p>{卡片内容}</p>
    </div>
  </div>

  <!-- ===== divider: 章节饰线（居中饰点分隔线） ===== -->
  <div class="divider"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>

  <!-- ===== 尾页：致谢（转换时新起一页） ===== -->
  <section class="title end_page">
    <h1>{致谢/结语标题}</h1>
    <p>{致谢内容/联系方式}</p>
  </section>

</body>
</html>
