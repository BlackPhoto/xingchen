<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{文档标题}</title>
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { min-height: 100%; }
body {
  position: relative;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", "Noto Sans SC", sans-serif;
  color: {text};
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 24px;
  background: linear-gradient(160deg, {bg_gradient_a} 0%, {card} 45%, {bg_gradient_b} 100%);
  min-height: 100vh;
}
/* 全局光斑 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 45% 35% at 18% 8%, rgba(255,255,255,0.55) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 88% 90%, rgba(255,255,255,0.45) 0%, transparent 55%);
}
body > * { position: relative; z-index: 1; }

/* ========== 封面 Hero ========== */
.title {
  position: relative;
  overflow: hidden;
  padding: 56px 40px;
  text-align: center;
  background: linear-gradient(135deg, {gradient_start} 0%, {gradient_mid} 50%, {gradient_end} 100%);
  color: #ffffff;
  border-radius: 16px;
  margin-bottom: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}
.title::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 55% at 18% 82%, rgba(255,255,255,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 55% 40% at 82% 18%, rgba(255,255,255,0.08) 0%, transparent 55%);
  pointer-events: none;
}
.title > * { position: relative; z-index: 1; }
.title h1 { font-size: 28px; font-weight: 800; margin: 0 0 14px 0; letter-spacing: 1px; color: #ffffff; }
.title .accent-line {
  width: 48px; height: 3px; background: rgba(255,255,255,0.85);
  margin: 0 auto 18px; border-radius: 2px;
}
.title p { font-size: 15px; color: rgba(255,255,255,0.85); margin: 0; line-height: 1.7; }

/* ========== 章节标题 ========== */
h1.heading {
  font-size: 28px;
  color: {primary};
  margin: 36px 0 16px 0;
  font-weight: 700;
  border-left: 4px solid {accent};
  padding-left: 16px;
}
h2.heading {
  font-size: 22px;
  color: {primary};
  margin: 28px 0 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid {primary_light};
  font-weight: 600;
}

/* ========== 正文 / 列表 ========== */
.paragraph { font-size: 15px; color: {text}; line-height: 1.8; margin: 0 0 16px 0; text-indent: 2em; }
.list { margin: 0 0 16px 0; padding-left: 24px; font-size: 15px; color: {text}; line-height: 1.8; }
.list li { margin-bottom: 8px; }
.list li::marker { color: {accent}; }

/* ========== callout ========== */
.callout {
  margin: 0 0 16px 0;
  padding: 16px 24px;
  background: {accent_light};
  border-left: 4px solid {accent};
  border-radius: 8px;
}
.callout[data-variant="warning"] { background: #FFF3E0; border-left-color: {warning}; }
.callout p { font-size: 15px; color: {text}; margin: 0; line-height: 1.8; }

/* ========== 深挖折叠（details/summary，无 JS） ========== */
details.deep-dive {
  background: {card};
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  margin: 0 0 16px 0;
  padding: 4px 0;
  border-left: 3px solid {accent};
}
details.deep-dive summary {
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 600;
  color: {primary};
  cursor: pointer;
}
details.deep-dive .content { padding: 0 20px 16px; }

/* ========== 步骤条（timeline 风格） ========== */
.timeline { list-style: none; padding: 0; margin: 0 0 16px 0; }
.timeline li {
  position: relative;
  padding-left: 28px;
  padding-bottom: 18px;
  border-left: 2px solid {accent_light};
  margin-left: 6px;
}
.timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline li::before {
  content: '';
  position: absolute;
  left: -7px; top: 5px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: {accent};
  border: 2px solid {bg};
  box-shadow: 0 0 0 2px {accent_light};
}
.timeline strong { font-size: 14px; color: {accent}; }
.timeline p { font-size: 15px; color: {text}; margin: 4px 0 0 0; line-height: 1.8; }

/* ========== code ========== */
.code {
  background: #1e293b;
  color: #e2e8f0;
  padding: 16px 24px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.6;
  overflow-x: auto;
  margin: 0 0 16px 0;
  font-family: 'Cascadia Code', 'Fira Code', 'SF Mono', 'Source Code Pro', Consolas, monospace;
}

/* ========== FAQ（浅底问答卡） ========== */
.faq-item {
  margin: 0 0 12px 0;
  padding: 16px 20px;
  background: {card};
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  border-left: 3px solid {accent_light};
}
.faq-item:hover { border-left-color: {accent}; }
.faq-item .q { font-size: 15px; font-weight: bold; color: {primary}; margin: 0 0 6px 0; }
.faq-item .a { font-size: 15px; color: {text}; margin: 0; padding-left: 16px; line-height: 1.8; }

/* ========== 尾页 ========== */
.end_page {
  margin-top: 24px;
  padding: 56px 24px;
  text-align: center;
  background: linear-gradient(135deg, {primary_light} 0%, {accent_light} 100%);
  border-radius: 16px;
}
.end_page h1 { font-size: 28px; color: {primary}; margin: 0 0 16px 0; font-weight: 800; }
.end_page p  { font-size: 15px; color: {text_secondary}; margin: 0; line-height: 1.8; }

/* ========== 响应式 ========== */
@media screen and (max-width: 600px) {
  body { padding: 16px !important; }
  h1 { font-size: 22px !important; }
  h2 { font-size: 18px !important; }
  h3 { font-size: 16px !important; }
}

/* ========== 打印优化 ========== */
@media print {
  body {
    padding: 0 !important;
    margin: 0 !important;
    background: {bg};
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  body::before { display: none; }
  .title, .end_page { border-radius: 0; box-shadow: none; }
  .faq-item, details.deep-dive { box-shadow: none; border: 1px solid {border}; }
  section { break-inside: auto !important; }
}
</style>
</head>
<body class="mode-explainer" data-palette="{调色板ID}">

  <!-- ===== title: 封面 ===== -->
  <section class="title">
    <h1>{教程/指南标题}</h1>
    <div class="accent-line"></div>
    <p>{目标读者/一句话简介}</p>
  </section>

  <!-- ===== 前置提示（callout） ===== -->
  <aside class="callout" data-variant="tip">
    <p>{前置知识/准备工作说明}</p>
  </aside>

  <!-- ===== 第一章 ===== -->
  <h1 class="heading">{第一章：概念讲解}</h1>
  <p class="paragraph">{概念讲解正文}</p>

  <!-- 深挖：可折叠细节 -->
  <details class="deep-dive">
    <summary>深挖：{进阶知识点标题}</summary>
    <div class="content">
      <p class="paragraph" style="font-size:14px;color:{text};line-height:1.8;margin:0 0 12px 0;">{进阶内容}</p>
    </div>
  </details>

  <!-- ===== 第二步：操作演示 ===== -->
  <h2 class="heading">{第二步：操作演示}</h2>

  <!-- 操作步骤（timeline 风格步骤条） -->
  <ol class="timeline">
    <li>
      <strong>{步骤1标题}</strong>
      <p>{步骤说明}</p>
    </li>
    <li>
      <strong>{步骤2标题}</strong>
      <p>{步骤说明}</p>
    </li>
  </ol>

  <!-- 代码示例 -->
  <pre class="code" data-lang="bash"><code>{示例命令/代码}</code></pre>

  <!-- ===== 常见问题（faq） ===== -->
  <h2 class="heading">{常见问题}</h2>
  <div class="faq-item">
    <p class="q">Q: {问题}</p>
    <p class="a">A: {回答}</p>
  </div>

  <!-- ===== 尾页 ===== -->
  <section class="title end_page">
    <h1>{总结/结语}</h1>
    <p>{总结内容/进阶建议}</p>
  </section>

</body>
</html>
